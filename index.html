<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Maria Chambers — Director</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=DM+Mono:wght@400;500&family=Playfair+Display:ital,wght@1,500&display=swap" rel="stylesheet">
<style>
:root{--black:#090908;--cream:#eadcc1;--orange:#e34b16;--muted:#b6a991}
*{box-sizing:border-box}html{scroll-behavior:smooth}body{margin:0;background:var(--black);color:var(--cream);font-family:'DM Mono',monospace}
a{color:inherit;text-decoration:none}.page{max-width:1600px;margin:auto;position:relative;overflow:hidden;padding:32px clamp(22px,5vw,78px) 30px}
.film-edge{position:absolute;left:0;top:0;width:22px;height:570px;background:linear-gradient(90deg,#f5b36a,#e34b16 45%,#1b0c07);opacity:.95}
.film-edge:after{content:"";position:absolute;inset:0;background:repeating-linear-gradient(to bottom,transparent 0 76px,#090908 76px 108px,transparent 108px 184px)}
header{display:grid;grid-template-columns:minmax(260px,1fr) minmax(180px,.9fr) auto;align-items:start;gap:24px;position:relative;z-index:2;min-height:150px}
.brand{font-family:'Bebas Neue',Impact,sans-serif;font-size:clamp(68px,10.2vw,148px);line-height:.72;letter-spacing:-.035em;max-width:500px}
.role{font-family:'Playfair Display',serif;font-style:italic;font-size:clamp(20px,2.3vw,32px);padding-top:27px;position:relative}
.role:after{content:"";display:block;height:2px;background:var(--orange);margin-top:12px;width:100%}
nav{display:flex;gap:clamp(18px,3.5vw,52px);padding-top:20px;font-size:clamp(11px,1.2vw,16px);letter-spacing:.12em}
nav a{padding-bottom:8px}nav a:first-child{color:var(--orange);border-bottom:2px solid var(--orange)}
.hero-wrap{position:relative;margin:-8px 0 0 2%;min-height:300px}
.orange-block{position:absolute;left:0;top:95px;width:8%;height:270px;background:#c52e13}
.hero{position:relative;margin-left:7%;height:clamp(300px,39vw,500px);background:linear-gradient(110deg,#263d4b,#536b77 55%,#182a34);overflow:hidden}
.hero:before{content:"";position:absolute;inset:0;background:radial-gradient(ellipse at 60% 45%,#a56b51 0 13%,transparent 14%),linear-gradient(90deg,transparent,#1118);opacity:.6}
.hero-label{position:absolute;left:-1%;bottom:12px;background:var(--black);padding:16px 20px 8px 0;font-size:11px;line-height:1.8;letter-spacing:.1em}
.hero-label span{color:var(--orange)}
.hero-note{position:absolute;right:18px;bottom:16px;font-size:9px;letter-spacing:.15em;color:#e8dfd0}
.section-title{font-family:'Playfair Display',serif;font-style:italic;font-size:clamp(36px,5vw,64px);color:var(--orange);margin:38px 0 8px}
.projects{display:grid;grid-template-columns:repeat(3,1fr);gap:clamp(14px,2vw,30px)}
.still{height:clamp(130px,16vw,220px);position:relative;overflow:hidden;background:#34221d}
.still:after{content:"";position:absolute;inset:0;background:linear-gradient(140deg,#6e2418,#d05b2c 45%,#1c1a18);opacity:.8}
.project:nth-child(2) .still:after{background:linear-gradient(140deg,#d1a66c,#7b866e 48%,#253a3c)}
.project:nth-child(3) .still:after{background:linear-gradient(140deg,#e5a16b,#bd7548 50%,#25343b)}
.still:before{content:"";position:absolute;inset:0;z-index:1;opacity:.22;background:repeating-linear-gradient(0deg,transparent 0 3px,#fff 4px,transparent 5px)}
.project-name{font-family:'Playfair Display',serif;font-style:italic;font-size:clamp(23px,3vw,43px);color:var(--orange);margin:7px 0 4px}
.meta{font-size:clamp(9px,.95vw,12px);letter-spacing:.1em;color:var(--cream);text-transform:uppercase}
.bottom-line{height:2px;background:var(--orange);margin-top:22px}
footer{display:flex;justify-content:space-between;padding-top:13px;font-size:9px;letter-spacing:.12em;color:var(--muted)}
@media(max-width:760px){header{grid-template-columns:1fr auto;gap:12px;min-height:150px}.brand{font-size:clamp(64px,16vw,110px)}.role{grid-column:1;grid-row:2;padding-top:0;margin-top:-35px;max-width:220px}nav{grid-column:2;grid-row:1/3;flex-direction:column;gap:15px;align-items:flex-end}.hero-wrap{margin-top:8px}.hero{margin-left:5%;height:58vw;min-height:230px}.orange-block{top:65px;height:180px;width:10%}.projects{grid-template-columns:1fr}.still{height:54vw}.section-title{margin-top:32px}.film-edge{height:460px}}
</style>
</head>
<body>
<div class="page">
<div class="film-edge" aria-hidden="true"></div>
<header>
  <a class="brand" href="#">MARIA<br>CHAMBERS</a>
  <div class="role">Director</div>
  <nav><a href="#film">FILM</a><a href="#photo">PHOTO</a><a href="#contact">CONTACT</a></nav>
</header>
<section class="hero-wrap">
  <div class="orange-block"></div>
  <div class="hero" role="img" aria-label="Hero film still placeholder">
    <div class="hero-note">HERO STILL / 16MM</div>
  </div>
  <div class="hero-label">ANALOGUE FILM<br><span>16MM / SUPER 8</span></div>
</section>
<section id="film">
  <h2 class="section-title">Film</h2>
  <div class="projects">
    <a class="project" href="mailto:YOUR-EMAIL@example.com?subject=Hide%20From%20The%20Light">
      <div class="still" aria-label="Replace with Hide From The Light still"></div>
      <div class="project-name">Hide From The Light</div><div class="meta">Music video&nbsp; / &nbsp;16mm</div>
    </a>
    <a class="project" href="#">
      <div class="still" aria-label="Replace with project still"></div>
      <div class="project-name">Project title</div><div class="meta">Short film&nbsp; / &nbsp;16mm</div>
    </a>
    <a class="project" href="#">
      <div class="still" aria-label="Replace with project still"></div>
      <div class="project-name">Project title</div><div class="meta">Super 8&nbsp; / &nbsp;Film</div>
    </a>
  </div>
</section>
<section id="photo">
  <h2 class="section-title">Photo</h2>
  <div class="meta">Selected analogue photography — coming soon</div>
</section>
<div class="bottom-line"></div>
<footer id="contact"><span>MARIA CHAMBERS · DIRECTOR</span><a href="mailto:YOUR-EMAIL@example.com">CONTACT</a><span>© 2026</span></footer>
</div>
</body></html>
