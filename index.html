<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Maria Chambers — Director</title>
<meta name="description" content="Maria Chambers — Director. Film and photography.">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=DM+Mono:wght@400;500&family=Playfair+Display:ital,wght@1,500&display=swap" rel="stylesheet">
<style>
:root{--black:#090908;--cream:#eadcc1;--orange:#e34b16;--muted:#b6a991}*{box-sizing:border-box}html{scroll-behavior:smooth}body{margin:0;background:var(--black);color:var(--cream);font-family:'DM Mono',monospace}a{color:inherit;text-decoration:none}.page{max-width:1600px;margin:auto;position:relative;overflow:hidden;padding:32px clamp(22px,5vw,78px) 30px}.film-edge{position:absolute;left:0;top:0;width:22px;height:570px;background:linear-gradient(90deg,#f5b36a,#e34b16 45%,#1b0c07);opacity:.95}.film-edge:after{content:"";position:absolute;inset:0;background:repeating-linear-gradient(to bottom,transparent 0 76px,#090908 76px 108px,transparent 108px 184px)}header{display:grid;grid-template-columns:minmax(260px,1fr) minmax(180px,.9fr) auto;align-items:start;gap:24px;position:relative;z-index:2;min-height:150px}.brand{font-family:'Bebas Neue',Impact,sans-serif;font-size:clamp(68px,10.2vw,148px);line-height:.72;letter-spacing:-.035em;max-width:500px}.role{font-family:'Playfair Display',serif;font-style:italic;font-size:clamp(20px,2.3vw,32px);padding-top:27px;position:relative}.role:after{content:"";display:block;height:2px;background:var(--orange);margin-top:12px;width:100%}nav{display:flex;gap:clamp(18px,3.5vw,52px);padding-top:20px;font-size:clamp(11px,1.2vw,16px);letter-spacing:.12em}nav a{padding-bottom:8px}nav a:first-child{color:var(--orange);border-bottom:2px solid var(--orange)}.hero-wrap{position:relative;margin:-8px 0 0 2%;min-height:300px}.orange-block{position:absolute;left:0;top:95px;width:8%;height:270px;background:#c52e13}.hero{position:relative;margin-left:7%;height:clamp(300px,39vw,500px);background:linear-gradient(110deg,#263d4b,#536b77 55%,#182a34);overflow:hidden;background-size:cover;background-position:center}.hero:before{content:"";position:absolute;inset:0;background:linear-gradient(90deg,transparent,#1115);pointer-events:none}.hero-note{position:absolute;right:18px;bottom:16px;font-size:9px;letter-spacing:.15em;color:#e8dfd0;text-shadow:0 1px 4px #000}.hero-label{position:absolute;left:-1%;bottom:12px;background:var(--black);padding:16px 20px 8px 0;font-size:11px;line-height:1.8;letter-spacing:.1em}.hero-label span{color:var(--orange)}.section-title{font-family:'Playfair Display',serif;font-style:italic;font-size:clamp(36px,5vw,64px);color:var(--orange);margin:38px 0 8px}.projects{display:grid;grid-template-columns:repeat(3,1fr);gap:clamp(14px,2vw,30px)}.project{display:block;min-width:0}.still{height:clamp(130px,16vw,220px);position:relative;overflow:hidden;background:linear-gradient(140deg,#6e2418,#d05b2c 45%,#1c1a18);background-size:cover;background-position:center}.still:after{content:"";position:absolute;inset:0;background:repeating-linear-gradient(0deg,transparent 0 3px,#fff2 4px,transparent 5px);pointer-events:none}.project-name{font-family:'Playfair Display',serif;font-style:italic;font-size:clamp(23px,3vw,43px);color:var(--orange);margin:7px 0 4px}.meta{font-size:clamp(9px,.95vw,12px);letter-spacing:.1em;color:var(--cream);text-transform:uppercase}.empty{color:var(--muted);font-size:11px;letter-spacing:.08em;padding:14px 0 24px}.photo-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:14px}.photo-grid img{display:block;width:100%;aspect-ratio:4/5;object-fit:cover;background:#28221c}.bottom-line{height:2px;background:var(--orange);margin-top:22px}footer{display:flex;justify-content:space-between;gap:12px;padding-top:13px;font-size:9px;letter-spacing:.12em;color:var(--muted)}.status{font-size:10px;color:var(--muted);margin-top:8px}
@media(max-width:760px){header{grid-template-columns:1fr auto;gap:12px;min-height:150px}.brand{font-size:clamp(64px,16vw,110px)}.role{grid-column:1;grid-row:2;padding-top:0;margin-top:-35px;max-width:220px}nav{grid-column:2;grid-row:1/3;flex-direction:column;gap:15px;align-items:flex-end}.hero-wrap{margin-top:8px}.hero{margin-left:5%;height:58vw;min-height:230px}.orange-block{top:65px;height:180px;width:10%}.projects{grid-template-columns:1fr}.still{height:54vw}.section-title{margin-top:32px}.film-edge{height:460px}.photo-grid{grid-template-columns:repeat(2,1fr)}footer{flex-wrap:wrap}}
</style>
</head>
<body><div class="page"><div class="film-edge" aria-hidden="true"></div>
<header><a class="brand" href="#top">MARIA<br>CHAMBERS</a><div class="role">Director</div><nav><a href="#film">FILM</a><a href="#photo">PHOTO</a><a href="#contact">CONTACT</a></nav></header>
<section class="hero-wrap" id="top"><div class="orange-block"></div><div class="hero" id="hero-image" role="img" aria-label="Featured film still"><div class="hero-note">SELECTED WORK / ANALOGUE FILM</div></div><div class="hero-label">DIRECTOR<br><span>16MM / SUPER 8 / PHOTO</span></div></section>
<section id="film"><h2 class="section-title">Film</h2><div class="projects" id="film-projects"></div><div class="status" id="film-status"></div></section>
<section id="photo"><h2 class="section-title">Photo</h2><div class="photo-grid" id="photo-projects"></div><div class="status" id="photo-status"></div></section>
<div class="bottom-line"></div><footer id="contact"><span>MARIA CHAMBERS · DIRECTOR</span><a id="contact-link" href="mailto:">CONTACT</a><span>© 2026</span></footer></div>
<script>
// Content is read from the public GitHub repository so Pages CMS edits appear here automatically.
const OWNER='mariachambersfilm', REPO='maria-chambers-portfolio', BRANCH='main';
const apiBase=`https://api.github.com/repos/${OWNER}/${REPO}/contents`;
function parseFrontmatter(raw){const m=raw.match(/^---\s*\n([\s\S]*?)\n---/);if(!m)return{};const out={};for(const line of m[1].split(/\r?\n/)){const p=line.match(/^([\w-]+):\s*(.*)$/);if(p){let v=p[2].trim();if((v.startsWith('"')&&v.endsWith('"'))||(v.startsWith("'")&&v.endsWith("'")))v=v.slice(1,-1);out[p[1]]=v;}}return out;}
function safe(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}
function imageStyle(url){return url?` style="background-image:url('${safe(url)}')"`:'';}
async function listMarkdown(folder){const r=await fetch(`${apiBase}/${folder}?ref=${BRANCH}`);if(r.status===404)return[];if(!r.ok)throw new Error('Could not read '+folder);const files=await r.json();return Promise.all(files.filter(f=>f.type==='file'&&f.name.endsWith('.md')).map(async f=>{const x=await fetch(f.download_url);return parseFrontmatter(await x.text());}));}
async function load(){try{const [films,photos]=await Promise.all([listMarkdown('content/films'),listMarkdown('content/photographs')]);const filmHost=document.getElementById('film-projects');films.sort((a,b)=>(Number(a.order)||999)-(Number(b.order)||999));filmHost.innerHTML=films.map(p=>{const href=p.link||'#';const tag=href==='#'?'div':'a';return `<${tag} class="project" ${tag==='a'?`href="${safe(href)}" target="_blank" rel="noopener"`:''}><div class="still"${imageStyle(p.image)}></div><div class="project-name">${safe(p.title||'Untitled')}</div><div class="meta">${safe(p.category||'Film')} ${p.year?' / '+safe(p.year):''} ${p.format?' / '+safe(p.format):''}</div></${tag}>`;}).join('');document.getElementById('film-status').textContent=films.length?'':'Add projects in the Films section of your CMS.';
const photoHost=document.getElementById('photo-projects');photoHost.innerHTML=photos.filter(p=>p.image).map(p=>`<img src="${safe(p.image)}" alt="${safe(p.title||'Selected photograph')}" loading="lazy">`).join('');document.getElementById('photo-status').textContent=photos.length?'':'Add photographs in the Photographs section of your CMS.';
}catch(e){document.getElementById('film-status').textContent='Portfolio content will appear here once the repository content folders are published.';document.getElementById('photo-status').textContent='';console.error(e);}}
async function loadSettings(){try{const r=await fetch(`${apiBase}/data/site.json?ref=${BRANCH}`);if(!r.ok)return;const s=await r.json();const data=JSON.parse(atob(s.content.replace(/\n/g,'')));if(data.email){const a=document.getElementById('contact-link');a.href='mailto:'+data.email;}if(data.heroImage)document.getElementById('hero-image').style.backgroundImage=`url('${data.heroImage}')`;}catch(e){console.warn('Site settings not loaded',e);}}
load();loadSettings();
</script></body></html>
